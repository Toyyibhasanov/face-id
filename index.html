<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceID Skaner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }
        video {
            width: 100%;
            border-radius: 10px;
            background-color: #222;
            transform: scaleX(-1);
        }
        button {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 25px;
            border: none;
            background-color: #0088cc;
            color: white;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:disabled {
            background-color: #aaa;
        }
    </style>
</head>
<body>

<div class="container">
    <h3>KORXONA FACE-ID SYSTEM</h3>
    <p>Iltimos, yuzingizni kameraga to'g'rilab, tugmani bosing</p>
    <video id="video" autoplay playsinline></video>
    <button id="captureBtn">📷 Yuzni skner qilish</button>
    <canvas id="canvas" style="display:none;"></canvas>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Telegramdan foydalanuvchining ID raqamini olish
    const user = tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
    const chatId = user ? user.id : "No_ID";

    const video = document.getElementById('video');
    const captureBtn = document.getElementById('captureBtn');
    const canvas = document.getElementById('canvas');

    // Kamerani ishga tushirish
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then(stream => {
            video.srcObject = stream;
        })
        .catch(err => {
            alert("Kameraga ruxsat berilmadi yoki xatolik: " + err);
        });

    captureBtn.addEventListener('click', () => {
        captureBtn.disabled = true;
        captureBtn.innerText = "Tekshirilmoqda...";

        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imageData = canvas.toDataURL('image/jpeg', 0.6);

        // Google Apps Script havola manzilingiz (Sizning 27-versiyadagi Web URL manzilingiz)
        const webAppUrl = "https://script.google.com/macros/s/AKfycbzwvvl-O4siuKPhtDcX7jGH_EX6hvN0sNGMmzeR-rlyEU3l4zXyZvRwfpdG76d9itFQ/exec";

        // Ma'lumotlarni to'g'ridan-to'g'ri Google Scriptga POST qilish
        fetch(webAppUrl, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                action: "face_verify",
                chatId: chatId,
                image: imageData
            })
        })
        .then(() => {
            // Rasmni yuborib bo'lgach, WebApp oynasini srazu yopish
            setTimeout(() => {
                tg.close();
            }, 1500);
        })
        .catch(err => {
            alert("Xatolik yuz berdi: " + err);
            captureBtn.disabled = false;
            captureBtn.innerText = "📷 Yuzni skner qilish";
        });
    });
</script>

</body>
</html>
