<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceID Skaner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }
        video {
            width: 100%;
            border-radius: 10px;
            background-color: #222;
            transform: scaleX(-1);
        }
        button {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 25px;
            border: none;
            background-color: #0088cc;
            color: white;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:disabled {
            background-color: #aaa;
        }
    </style>
</head>
<body>

<div class="container">
    <h3>KORXONA FACE-ID SYSTEM</h3>
    <p>Iltimos, yuzingizni kameraga to'g'rilab, tugmani bosing</p>
    <video id="video" autoplay playsinline></video>
    <button id="captureBtn">📷 Yuzni skner qilish</button>
    <canvas id="canvas" style="display:none;"></canvas>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const video = document.getElementById('video');
    const captureBtn = document.getElementById('captureBtn');
    const canvas = document.getElementById('canvas');

    // Kamerani ishga tushirish
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then(stream => {
            video.srcObject = stream;
        })
        .catch(err => {
            alert("Kameraga ruxsat berilmadi yoki xatolik: " + err);
        });

    captureBtn.addEventListener('click', () => {
        captureBtn.disabled = true;
        captureBtn.innerText = "Tekshirilmoqda...";

        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imageData = canvas.toDataURL('image/jpeg', 0.7);

        // Telegram Botga ma'lumot yuborish
        const dataToSend = {
            action: "face_verify",
            image: imageData
        };

        tg.sendData(JSON.stringify(dataToSend));
        
        setTimeout(() => {
            tg.close();
        }, 1000);
    });
</script>

</body>
</html>
